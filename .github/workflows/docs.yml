name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sphinx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install package + docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gmail,web]"
          pip install "sphinx>=8" "sphinx-rtd-theme>=2" "myst-parser>=4"
      - name: Build API docs
        run: |
          sphinx-build docs/api docs/api/_build/html -W --keep-going -n
