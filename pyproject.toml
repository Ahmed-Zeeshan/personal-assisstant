[project]
name = "voice-assistant"
version = "0.1.0"
description = "Personal voice-controlled assistant for the desktop"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "litellm>=1.80",
    "python-dotenv>=1.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
audio = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4.6",
    "pynput>=1.7.6",
    "numpy>=2.4.4",
    "piper-tts>=1.2",
]
gmail = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
]
desktop = ["pywebview>=5"]
web = [
    "duckduckgo-search>=6.0",
    "trafilatura>=1.12",
    "httpx>=0.27",
]
memory = [
    "sqlite-vec>=0.1.6",
    "numpy>=2.4.4",
]
browser = [
    "playwright>=1.49",
]
wake = [
    "openwakeword>=0.6",
    "onnxruntime>=1.17",
]
security = ["cryptography>=42.0", "keyring>=24"]
vad = [
    # Silero VAD: lazy-imported by voice_assistant.audio.vad
    # Requires PyTorch; install torch separately for your platform.
    "silero-vad>=4",
]
e2e = [
    "pytest-playwright>=0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4",
    "ruff>=0.9.0",
    "mypy>=1.8",
    "hypothesis>=6.100",
]
docs = [
    "sphinx>=8",
    "sphinx-rtd-theme>=2",
    "myst-parser>=4",
]

[project.scripts]
voice-assistant = "voice_assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_assistant = ["desktop/web_dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/voice_assistant/desktop/web_dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF"]
ignore = [
  "E501",   # line too long (formatter handles it)
  "S101",   # assert allowed (we use it in tests + dev)
  "S603",   # subprocess call risk — we use it for legitimate tools
  "S607",   # subprocess partial path — same
  "B008",   # function call in argument default (FastAPI/typer pattern, used in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
  "^tests/",
  "^build/",
  "^src/voice_assistant/desktop/web_dist/",
]

# Pragmatic: third-party libs without good stubs
[[tool.mypy.overrides]]
module = ["litellm.*", "duckduckgo_search.*", "trafilatura.*", "webview.*", "pyaudio.*", "sounddevice.*", "piper.*", "pynput.*", "playwright.*", "sqlite_vec.*", "google.*", "googleapiclient.*", "loguru.*", "google_auth_oauthlib.*", "faster_whisper.*", "openwakeword.*", "onnxruntime.*", "keyring.*", "silero_vad.*", "torch.*"]
ignore_missing_imports = true
